# Continuous integration for DeCura. Contributes to DECURA-REL1-2026-001: SEC-01, SEC-07, SEC-14, QA-04.
# Every third-party action is pinned to a full commit hash; the comment names the release.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, so new advisories against an unchanged lockfile are caught (SEC-07).
  schedule:
    - cron: '0 6 * * 1'

# Read-only token for every job. No job can push, comment or change settings.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. Each push to main has its
# own group and is never cancelled or replaced, so every merge commit keeps a
# completed CI record (QA-04).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out every commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # Only the gitleaks folder goes on PATH, not the whole of $RUNNER_TEMP.
        run: |
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir "$bin_dir"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan the whole git history
        run: |
          mkdir -p reports
          gitleaks git --redact --verbose --exit-code 1 \
            --report-format json --report-path reports/gitleaks.json .

      # QA-10: the redacted report is kept with the run (docs/validation/README.md).
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-report-${{ github.sha }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn

  app-checks:
    name: Audit, type check, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if package-lock.json is missing or out of step with package.json.
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts

      # QA-01-T01: every requirement traces to a test in the matrix.
      - name: Traceability matrix
        if: ${{ !cancelled() }}
        run: scripts/check-traceability.sh

      # SEC-07: fail on any critical or high vulnerability without a current waiver.
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          # npm audit exits non-zero whenever it finds anything; the script decides.
          npm audit --json > reports/npm-audit.json || true
          scripts/check-audit.sh reports/npm-audit.json

      # Every Expo package matches the versions bundled with the locked expo
      # package. Offline, so the result depends only on this commit.
      - name: Expo set consistency
        if: ${{ !cancelled() }}
        env:
          EXPO_OFFLINE: '1'
        run: npx expo install --check

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test -- --ci --json --outputFile=reports/jest.json

      # QA-04: no test skipped without documented justification.
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: scripts/check-skipped-tests.sh reports/jest.json

      # QA-04, QA-10: keep the audit and test reports with the run. Release
      # candidate evidence is copied to the private validation store.
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-check-reports-${{ github.sha }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn

  # Newer Expo releases than the lockfile has. Weekly and manual runs only, as its
  # own job, so its result never hides the audit or the required check. Fails
  # only once a newer version is old enough to adopt (docs/security/README.md).
  expo-drift:
    name: Expo version drift
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts

      - name: Newer Expo versions
        run: scripts/check-expo-drift.sh
